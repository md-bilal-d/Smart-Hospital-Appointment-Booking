{% extends 'base.html' %}
{% block title %}{{ _('Reset Password') }}{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="glass p-10 animate-card-entrance">
      <h1 class="text-3xl font-black text-white text-center mb-6">{{ _('Forgot Your Password?') }}</h1>
      <form method="POST" class="space-y-6">
        <div>
          <label class="block text-[10px] font-black text-white/40 uppercase tracking-widest mb-2 ml-1">{{ _('Email Address') }}</label>
          <input type="email" name="email" required placeholder="patient@example.com" class="w-full glass-input px-5 py-4" />
        </div>
        <button type="submit" class="w-full py-4 btn-gradient text-white font-black uppercase tracking-widest text-sm rounded-xl shadow-2xl transition-all">{{ _('Send Reset Link') }}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
