{% extends 'base.html' %}
{% block title %}My Calendar{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex flex-col lg:flex-row gap-8">
        
        <!-- Sidebar: Upcoming Appointments -->
        <div class="lg:w-1/3">
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 sticky top-20">
                <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                    <span class="text-indigo-600">📅</span> Upcoming
                </h3>
                <div id="upcoming-list" class="space-y-4">
                    <div class="text-center py-10 text-gray-400 font-medium">Loading...</div>
                </div>
                <div class="mt-6 pt-6 border-t border-gray-100">
                    <a href="/book" class="block w-full py-3 bg-indigo-50 text-indigo-700 text-center font-bold rounded-xl hover:bg-indigo-600 hover:text-white transition-all">
                        + New Appointment
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Calendar -->
        <div class="lg:w-2/3">
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                
                <!-- Toolbar -->
                <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
                    <div class="flex items-center gap-4">
                        <button onclick="changePeriod(-1)" class="w-10 h-10 rounded-xl bg-gray-50 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 font-bold flex items-center justify-center transition-all">&lt;</button>
                        <h2 id="current-month-year" class="text-2xl font-black text-gray-900 min-w-[200px] text-center">Month Year</h2>
                        <button onclick="changePeriod(1)" class="w-10 h-10 rounded-xl bg-gray-50 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 font-bold flex items-center justify-center transition-all">&gt;</button>
                    </div>
                    <div class="flex bg-gray-100 p-1 rounded-xl">
                        <button onclick="setView('month')" id="btn-month" class="px-6 py-2 rounded-lg font-bold text-sm bg-white shadow-sm text-indigo-600 transition-all">Month</button>
                        <button onclick="setView('week')" id="btn-week" class="px-6 py-2 rounded-lg font-bold text-sm text-gray-500 hover:text-gray-700 transition-all">Week</button>
                    </div>
                </div>

                <!-- Calendar Grid -->
                <div id="calendar-grid" class="w-full">
                    <!-- Rendered by JS -->
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Appointment Modal -->
<div id="appt-modal" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm hidden items-center justify-center z-50 animate-fade-in">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 shadow-2xl relative">
        <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-400 hover:text-gray-900 text-2xl leading-none">&times;</button>
        <div class="flex items-center gap-4 mb-6 pb-6 border-b border-gray-100">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl" id="modal-icon">🩺</div>
            <div>
                <h3 class="text-xl font-bold text-gray-900" id="modal-doctor">Dr. Name</h3>
                <p class="text-gray-500 font-medium text-sm" id="modal-date-time">Date • Time</p>
            </div>
        </div>
        
        <div class="space-y-4 mb-8">
            <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl">
                <span class="text-gray-500 font-semibold text-sm">Status</span>
                <span id="modal-status" class="px-3 py-1 rounded-lg text-sm font-bold">Status</span>
            </div>
            <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl">
                <span class="text-gray-500 font-semibold text-sm">Token</span>
                <span id="modal-token" class="font-black text-indigo-600 text-lg">#0</span>
            </div>
            <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl">
                <span class="text-gray-500 font-semibold text-sm">Type</span>
                <span id="modal-type" class="font-bold text-gray-900">Normal</span>
            </div>
        </div>

        <div class="flex flex-col gap-3" id="modal-actions">
            <!-- Form to cancel -->
            <form method="POST" action="/cancel/0" id="cancel-form">
                <button type="submit" onclick="return confirm('Are you sure you want to cancel this appointment?')" class="w-full py-3 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl transition-all">Cancel Appointment</button>
            </form>
            <button onclick="reschedule()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition-all">Reschedule</button>
        </div>
    </div>
</div>

<style>
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .cal-day { min-height: 120px; }
    .week-day { min-height: 400px; }
</style>

<script>
    let currentView = 'month';
    let currentDate = new Date();
    let appointments = [];
    let currentApptId = null;

    document.addEventListener("DOMContentLoaded", () => {
        fetchAppointments();
    });

    function fetchAppointments() {
        fetch('/api/appointments')
        .then(r => r.json())
        .then(data => {
            appointments = data;
            renderUpcoming();
            renderCalendar();
        });
    }

    function setView(view) {
        currentView = view;
        document.getElementById('btn-month').className = view === 'month' ? 'px-6 py-2 rounded-lg font-bold text-sm bg-white shadow-sm text-indigo-600 transition-all' : 'px-6 py-2 rounded-lg font-bold text-sm text-gray-500 hover:text-gray-700 transition-all';
        document.getElementById('btn-week').className = view === 'week' ? 'px-6 py-2 rounded-lg font-bold text-sm bg-white shadow-sm text-indigo-600 transition-all' : 'px-6 py-2 rounded-lg font-bold text-sm text-gray-500 hover:text-gray-700 transition-all';
        renderCalendar();
    }

    function changePeriod(dir) {
        if(currentView === 'month') {
            currentDate.setMonth(currentDate.getMonth() + dir);
        } else {
            currentDate.setDate(currentDate.getDate() + (dir * 7));
        }
        renderCalendar();
    }

    function renderUpcoming() {
        const list = document.getElementById('upcoming-list');
        list.innerHTML = '';
        
        const now = new Date();
        const upcoming = appointments.filter(a => a.status === 'waiting' || a.status === 'called')
            .sort((a,b) => new Date(a.date + 'T00:00:00') - new Date(b.date + 'T00:00:00'))
            .slice(0, 5);

        if(upcoming.length === 0) {
            list.innerHTML = '<div class="text-center py-6 text-gray-400 font-medium bg-gray-50 rounded-xl">No upcoming appointments</div>';
            return;
        }

        upcoming.forEach(a => {
            const div = document.createElement('div');
            div.className = "p-4 rounded-xl border border-gray-100 hover:shadow-md transition-all cursor-pointer bg-white group";
            div.onclick = () => openModal(a);
            div.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <div class="font-bold text-gray-900 group-hover:text-indigo-600 transition-colors">Dr. ${a.doctor_name}</div>
                    <div class="text-xs font-black text-indigo-600 bg-indigo-50 px-2 py-1 rounded">#${a.token}</div>
                </div>
                <div class="text-sm text-gray-500 font-medium">
                    ${new Date(a.date).toLocaleDateString('en-US', {month:'short', day:'numeric'})} • ${a.time}
                </div>
            `;
            list.appendChild(div);
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        if(currentView === 'month') {
            document.getElementById('current-month-year').textContent = currentDate.toLocaleDateString('en-US', {month: 'long', year: 'numeric'});
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            let html = `<div class="grid grid-cols-7 gap-px bg-gray-200 border border-gray-200 rounded-2xl overflow-hidden">`;
            
            // Headers
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.forEach(d => {
                html += `<div class="bg-gray-50 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">${d}</div>`;
            });

            // Empty slots
            for(let i=0; i<firstDay; i++) {
                html += `<div class="bg-white cal-day opacity-50"></div>`;
            }

            // Days
            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dayAppts = appointments.filter(a => a.date === dateStr);
                
                let isToday = new Date().toISOString().split('T')[0] === dateStr;
                
                html += `<div class="bg-white cal-day p-2 hover:bg-gray-50 transition-colors relative">
                    <div class="text-right mb-2">
                        <span class="inline-flex w-7 h-7 items-center justify-center rounded-full text-sm font-semibold ${isToday ? 'bg-indigo-600 text-white' : 'text-gray-700'}">${d}</span>
                    </div>
                    <div class="space-y-1">`;
                
                dayAppts.forEach(a => {
                    let color = 'bg-blue-100 text-blue-700';
                    if(a.status === 'seen') color = 'bg-emerald-100 text-emerald-700';
                    if(a.status === 'cancelled' || a.status === 'no_show') color = 'bg-red-100 text-red-700';
                    
                    html += `<div onclick='openModalById(${a.id})' class="text-xs px-2 py-1 rounded truncate cursor-pointer font-semibold ${color} hover:opacity-80 transition-opacity">
                        ${a.time} - Dr. ${a.doctor_name}
                    </div>`;
                });
                
                html += `</div></div>`;
            }
            
            html += `</div>`;
            grid.innerHTML = html;
        } else {
            // Week View
            const curr = new Date(currentDate);
            const first = curr.getDate() - curr.getDay();
            const firstDayOfWeek = new Date(curr.setDate(first));
            
            let endOfWeek = new Date(firstDayOfWeek);
            endOfWeek.setDate(firstDayOfWeek.getDate() + 6);
            
            const monthStr = firstDayOfWeek.getMonth() === endOfWeek.getMonth() 
                ? firstDayOfWeek.toLocaleDateString('en-US', {month: 'long'})
                : `${firstDayOfWeek.toLocaleDateString('en-US', {month: 'short'})} - ${endOfWeek.toLocaleDateString('en-US', {month: 'short'})}`;
            
            document.getElementById('current-month-year').textContent = `${monthStr} ${year}`;

            let html = `<div class="grid grid-cols-7 gap-4">`;
            
            for(let i=0; i<7; i++) {
                const d = new Date(firstDayOfWeek);
                d.setDate(d.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];
                const dayAppts = appointments.filter(a => a.date === dateStr);
                let isToday = new Date().toISOString().split('T')[0] === dateStr;

                html += `<div class="bg-gray-50 rounded-2xl p-3 week-day border ${isToday ? 'border-indigo-300 shadow-sm' : 'border-gray-100'}">
                    <div class="text-center pb-3 border-b border-gray-200 mb-3">
                        <div class="text-xs font-bold text-gray-500 uppercase">${d.toLocaleDateString('en-US', {weekday: 'short'})}</div>
                        <div class="text-2xl font-black ${isToday ? 'text-indigo-600' : 'text-gray-900'}">${d.getDate()}</div>
                    </div>
                    <div class="space-y-2">`;
                
                dayAppts.forEach(a => {
                    let color = 'bg-blue-100 text-blue-700 border-blue-200';
                    if(a.status === 'seen') color = 'bg-emerald-100 text-emerald-700 border-emerald-200';
                    if(a.status === 'cancelled' || a.status === 'no_show') color = 'bg-red-100 text-red-700 border-red-200';
                    
                    html += `<div onclick='openModalById(${a.id})' class="text-sm p-3 rounded-xl border cursor-pointer ${color} hover:shadow-md transition-all">
                        <div class="font-bold mb-1">Dr. ${a.doctor_name}</div>
                        <div class="flex justify-between items-center text-xs opacity-80 font-semibold">
                            <span>${a.time}</span>
                            <span>#${a.token}</span>
                        </div>
                    </div>`;
                });
                
                html += `</div></div>`;
            }
            html += `</div>`;
            grid.innerHTML = html;
        }
    }

    function openModalById(id) {
        const appt = appointments.find(a => a.id === id);
        if(appt) openModal(appt);
    }

    function openModal(appt) {
        currentApptId = appt.id;
        document.getElementById('modal-doctor').textContent = `Dr. ${appt.doctor_name}`;
        document.getElementById('modal-date-time').textContent = `${new Date(appt.date).toLocaleDateString('en-US', {month:'long', day:'numeric'})} • ${appt.time}`;
        document.getElementById('modal-token').textContent = `#${appt.token}`;
        document.getElementById('modal-type').textContent = appt.type.charAt(0).toUpperCase() + appt.type.slice(1);
        
        const statusEl = document.getElementById('modal-status');
        let statusText = appt.status.charAt(0).toUpperCase() + appt.status.slice(1).replace('_', ' ');
        if(appt.status === 'waiting' || appt.status === 'called') {
            statusEl.className = 'px-3 py-1 rounded-lg text-sm font-bold bg-blue-100 text-blue-700';
            document.getElementById('modal-actions').style.display = 'flex';
            document.getElementById('cancel-form').action = `/cancel/${appt.id}`;
        } else if(appt.status === 'seen') {
            statusEl.className = 'px-3 py-1 rounded-lg text-sm font-bold bg-emerald-100 text-emerald-700';
            document.getElementById('modal-actions').style.display = 'none';
        } else {
            statusEl.className = 'px-3 py-1 rounded-lg text-sm font-bold bg-red-100 text-red-700';
            document.getElementById('modal-actions').style.display = 'none';
        }
        statusEl.textContent = statusText;
        
        let icon = '🩺';
        if(appt.status === 'seen') icon = '✅';
        if(appt.status === 'cancelled') icon = '❌';
        document.getElementById('modal-icon').textContent = icon;
        document.getElementById('modal-icon').className = `w-16 h-16 rounded-2xl flex items-center justify-center text-3xl ${appt.status==='seen'?'bg-emerald-100':(appt.status==='cancelled'?'bg-red-100':'bg-indigo-100')}`;

        document.getElementById('appt-modal').classList.remove('hidden');
        document.getElementById('appt-modal').classList.add('flex');
    }

    function closeModal() {
        document.getElementById('appt-modal').classList.add('hidden');
        document.getElementById('appt-modal').classList.remove('flex');
    }

    function reschedule() {
        fetch(`/cancel/${currentApptId}`, { method: 'POST' })
        .then(() => {
            window.location.href = '/book';
        });
    }
</script>
{% endblock %}
