{% extends 'base.html' %}
{% block title %}Doctor Login{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-3xl shadow-2xl p-8 border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-blue-100 flex items-center justify-center text-3xl">🩺</div>
                <h1 class="text-2xl font-bold text-gray-900">Doctor Portal</h1>
                <p class="text-gray-500 mt-1">Select your profile to continue</p>
            </div>
            <form method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Select Doctor</label>
                    <select name="doctor_id" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-gray-50">
                        <option value="">Choose...</option>
                        {% for doc in doctors %}
                        <option value="{{ doc.id }}">{{ doc.name }} — {{ doc.specialization }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition-all">Enter Dashboard</button>
            </form>
            <p class="mt-6 text-center text-sm text-gray-500"><a href="/login" class="text-indigo-600 hover:underline">← Patient Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
