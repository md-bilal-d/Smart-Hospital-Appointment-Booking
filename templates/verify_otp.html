{% extends 'base.html' %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-3xl shadow-2xl p-8 border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-violet-100 flex items-center justify-center text-3xl pulse-glow">📱</div>
                <h1 class="text-2xl font-bold text-gray-900">Enter OTP</h1>
                <p class="text-gray-500 mt-1">A 6-digit code has been sent to you</p>
            </div>
            <form method="POST" class="space-y-5">
                <div>
                    <input type="text" name="otp" maxlength="6" required placeholder="000000" autofocus
                        class="w-full px-4 py-4 border-2 border-indigo-200 rounded-xl text-center text-3xl font-mono tracking-[0.5em] focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition-all">Verify OTP</button>
            </form>
            <div class="mt-6 text-center">
                <form action="/resend-otp" method="POST" class="inline">
                    <button type="submit" id="resendBtn" class="text-indigo-600 font-semibold hover:underline disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                        Resend OTP (<span id="countdown">30</span>s)
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let t=30;const btn=document.getElementById('resendBtn'),cd=document.getElementById('countdown');
const iv=setInterval(()=>{t--;cd.textContent=t;if(t<=0){clearInterval(iv);btn.disabled=false;btn.innerHTML='Resend OTP';}},1000);
</script>
{% endblock %}
