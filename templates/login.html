{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-3xl shadow-2xl p-8 border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-indigo-100 flex items-center justify-center text-3xl">🔐</div>
                <h1 class="text-2xl font-bold text-gray-900">Welcome Back</h1>
                <p class="text-gray-500 mt-1">Sign in to your MediSlot account</p>
            </div>
            <form method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email or Username</label>
                    <input type="text" name="email" required placeholder="patient@example.com"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all bg-gray-50 hover:bg-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
                    <input type="password" name="password" required placeholder="••••••••"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all bg-gray-50 hover:bg-white">
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all">Sign In</button>
            </form>
            <div class="mt-6 text-center space-y-2">
                <p class="text-sm text-gray-500">Don't have an account? <a href="/register" class="text-indigo-600 font-semibold hover:underline">Register</a></p>
                <p class="text-sm text-gray-500">Admin? Use <code class="bg-gray-100 px-2 py-0.5 rounded text-xs">admin / admin123</code></p>
                <a href="/doctor-login" class="inline-block mt-2 text-sm text-indigo-500 hover:underline">Doctor Portal →</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
